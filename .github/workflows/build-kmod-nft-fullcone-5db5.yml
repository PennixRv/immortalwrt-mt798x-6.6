name: Build kmod-nft-fullcone for current router firmware

on:
  workflow_dispatch:

jobs:
  build-kmod:
    runs-on: ubuntu-latest

    env:
      TARGET_COMMIT: 5db5b6621e7dc9a3dfc97d5a523f40c711cabba9
      UPSTREAM_REPO: https://github.com/immortalwrt/immortalwrt.git
      UPSTREAM_REF: openwrt-24.10
      EXPECTED_KERNEL_ABI: 3ca4b8cb2fcc3a2027e8496143a86cab

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: control

      - name: Checkout target source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 1
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd \
            zlib1g-dev zstd file

      - name: Show pinned source revision
        working-directory: src
        run: |
          git show --no-patch --format='commit=%H%nsubject=%s%ncommit_date=%cI'

      - name: Override kernel 6.6 details to 6.6.95
        working-directory: src
        run: |
          cat > include/kernel-6.6 <<'EOF'
          LINUX_VERSION-6.6 = .95
          LINUX_KERNEL_HASH-6.6.95 = 18640ae9a2c952f8f8868324378df1a9e138ad29e6b93a9c38155764ea67ea85
          EOF
          cat include/kernel-6.6

      - name: Clone official ImmortalWrt recipe source
        working-directory: src
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" "${UPSTREAM_REPO}" ../immortalwrt-upstream

      - name: Import fullconenat-nft package
        working-directory: src
        run: |
          rm -rf package/network/utils/fullconenat-nft
          cp -a ../immortalwrt-upstream/package/network/utils/fullconenat-nft package/network/utils/

      - name: Adjust Makefile for current router kernel config
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("package/network/utils/fullconenat-nft/Makefile")
          text = path.read_text()
          text = text.replace("    CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y\n", "")
          path.write_text(text)
          print(path.read_text())
          PY

      - name: Pin feeds from router build snapshot
        working-directory: src
        run: |
          test -f ../control/ci/router/current/build.feeds
          cp -v ../control/ci/router/current/build.feeds feeds.conf
          echo "Using pinned feeds:"
          cat feeds.conf

      - name: Update and install feeds
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed router build.config and enable candidate package
        working-directory: src
        run: |
          test -f ../control/ci/router/current/build.config
          cp -v ../control/ci/router/current/build.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-nft-fullcone=m
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_libnftnl11=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y$' .config
          grep -E '^CONFIG_TARGET_(mediatek|mediatek_filogic|mediatek_filogic_DEVICE_netcore_n60-pro)=|^CONFIG_PACKAGE_kmod-nft-fullcone=|^CONFIG_PACKAGE_kmod-nft-nat=' .config

      - name: Show config drift against router build snapshot
        working-directory: src
        run: |
          ./scripts/diffconfig.sh | tee ../diffconfig.txt

      - name: Prepare toolchain and target kernel tree
        working-directory: src
        run: |
          make tools/install toolchain/install target/linux/compile -j"$(nproc)" V=s

      - name: Capture kernel config fingerprint
        working-directory: src
        run: |
          set -euo pipefail
          linux_dir="$(find build_dir -type d -path '*linux-mediatek_filogic/linux-6.6.95' | head -n 1)"
          test -n "${linux_dir}"
          echo "LINUX_DIR=${linux_dir}" | tee ../linux_dir.txt
          cat "${linux_dir}/.vermagic" | tee ../kernel_vermagic.txt
          grep '=[ym]' "${linux_dir}/.config.set" | LC_ALL=C sort | md5sum | awk '{print $1}' | tee ../kernel_configset_md5.txt
          cp -v "${linux_dir}/.config.set" ../kernel.config.set
          cp -v "${linux_dir}/.config" ../kernel.config
          cp -v "${linux_dir}/.config.target" ../kernel.config.target
          cp -v "${linux_dir}/.config.override" ../kernel.config.override

      - name: Build only fullconenat-nft package
        working-directory: src
        run: |
          make package/network/utils/fullconenat-nft/compile -j"$(nproc)" V=s

      - name: Collect candidate artifacts
        run: |
          mkdir -p artifacts/ipk artifacts/ko artifacts/meta
          find src/bin -type f -name 'kmod-nft-fullcone_*.ipk' -exec cp -v {} artifacts/ipk/ \;
          find src/build_dir -type f -path '*fullconenat-nft*/src/nft_fullcone.ko' -exec cp -v {} artifacts/ko/ \;
          cp -v src/.config artifacts/meta/build.config
          cp -v src/feeds.conf artifacts/meta/feeds.conf
          cp -v diffconfig.txt artifacts/meta/diffconfig.txt
          cp -v linux_dir.txt artifacts/meta/linux_dir.txt
          cp -v kernel_vermagic.txt artifacts/meta/kernel_vermagic.txt
          cp -v kernel_configset_md5.txt artifacts/meta/kernel_configset_md5.txt
          cp -v kernel.config.set artifacts/meta/kernel.config.set
          cp -v kernel.config artifacts/meta/kernel.config
          cp -v kernel.config.target artifacts/meta/kernel.config.target
          cp -v kernel.config.override artifacts/meta/kernel.config.override
          printf '%s\n' "${EXPECTED_KERNEL_ABI}" > artifacts/meta/expected_kernel_abi.txt
          cp -v control/ci/router/current/build.config artifacts/meta/router.build.config
          cp -v control/ci/router/current/build.feeds artifacts/meta/router.build.feeds
          if [ -f control/ci/router/current/proc-config-5db5.config ]; then
            cp -v control/ci/router/current/proc-config-5db5.config artifacts/meta/
          fi
          if [ -f control/ci/router/current/openwrt-release-5db5.txt ]; then
            cp -v control/ci/router/current/openwrt-release-5db5.txt artifacts/meta/
          fi

      - name: Inspect candidate module metadata
        run: |
          set -e
          ko="$(find artifacts/ko -type f -name 'nft_fullcone.ko' | head -n 1)"
          if [ -n "${ko}" ]; then
            modinfo "${ko}" | tee artifacts/meta/modinfo.txt
          else
            echo "nft_fullcone.ko not found" | tee artifacts/meta/modinfo.txt
            exit 1
          fi

      - name: Inspect candidate ipk control metadata
        run: |
          set -euo pipefail
          ipk="$(find artifacts/ipk -type f -name 'kmod-nft-fullcone_*.ipk' | head -n 1 || true)"
          if [ -z "${ipk}" ]; then
            echo 'kmod-nft-fullcone ipk not found' | tee artifacts/meta/ipk-control.txt
          else
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "${tmpdir}"' EXIT
            if ar p "${ipk}" control.tar.gz > "${tmpdir}/control.tar.gz"; then
              tar -tzf "${tmpdir}/control.tar.gz" | tee artifacts/meta/ipk-control-members.txt || true
              member="$(tar -tzf "${tmpdir}/control.tar.gz" | awk '/(^|\/)control$/{print; exit}')"
              if [ -n "${member}" ]; then
                tar -xzf "${tmpdir}/control.tar.gz" -C "${tmpdir}" "${member}"
                cat "${tmpdir}/${member}" | tee artifacts/meta/ipk-control.txt
              else
                echo 'control member not found in control.tar.gz' | tee artifacts/meta/ipk-control.txt
              fi
            else
              echo 'failed to extract control.tar.gz from ipk' | tee artifacts/meta/ipk-control.txt
            fi
          fi
          printf 'expected_kernel_abi=%s\n' "${EXPECTED_KERNEL_ABI}" | tee -a artifacts/meta/ipk-control.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmod-nft-fullcone-candidate
          path: artifacts/
